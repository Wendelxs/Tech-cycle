<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Cycle - Cadastro</title>
  <link rel="stylesheet" href="imgs/logo.png">
  <link rel="stylesheet" href="cadastro.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="shortcut icon" href="Tech-cycle/Techycle1/imgs/icon.png" type="image/x-icon">
</head>

<body>
  <div class="container">
    <div class="cadastro-box">
      <div class="logo">
        
      </div>
      
      <div class="user-icon">
        <i class="fa-solid fa-user-circle"></i>
      </div>
      
      <h1>Cadastrar-se</h1>
      
      <form id="cadastro-form">
        <div class="form-group">
          <label for="empresa">Nome da Empresa</label>
          <input type="text" id="empresa" name="empresa" placeholder="Reutilize a tecnologia" required>
        </div>
        
        <div class="form-group">
          <label for="email">Endereço de e-mail</label>
          <input type="email" id="email" name="email" placeholder="reusetech@gmail.com" required>
        </div>
        
        <div class="form-group">
          <label for="cnpj">CNPJ</label>
          <input type="text" id="cnpj" name="cnpj" placeholder="31.024.432/0001-47" required>
        </div>
        
        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="password-container">
            <input type="password" id="senha" name="senha" placeholder="********" required>
            <button type="button" id="toggle-password" class="toggle-password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        
        <button type="submit" class="btn-criar-conta">Criar Conta</button>
      </form>
      
      <div class="login-link">
        <p>Você já tem uma conta? <a href="login.html">Conecte-se</a></p>
      </div>
    </div>
  </div>

  <script src="cadastro.js"></script>
</body>
</html>
