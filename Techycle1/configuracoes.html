<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Cycle - Configurações</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="noticacoes.css">
    <link rel="stylesheet" href="configuracoes.css" />
    <link rel="stylesheet" href="imgs/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="shortcut icon" href="imgs/icon.png" type="image/x-icon">
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <img src="imgs/logo.png" alt="Tech Cycle" />
            </div>
            <nav class="menu">
                <a href="index.html"><i class="fa-solid fa-location-dot"></i> Rotas</a>
                <a href="mapa.html"><i class="fa-solid fa-handshake-angle"></i> Pontos de Coletas</a>
                <a href="embalagens.html"><i class="fa-solid fa-boxes-stacked"></i> Embalagens</a>
                <a href="configuracoes.html" class="active"><i class="fa-solid fa-gear"></i> Configurações</a>
                <a href="login.html"><i class="fa-solid fa-door-open"></i> Sair</a>
            </nav>

            <nav class="menu2">
                <a href="#"><i class="fa-solid fa-chart-simple"></i> Relatórios</a>
                <a href="#"><i class="fa-solid fa-question"></i> Ajuda</a>
            </nav>
        </aside>

        <div class="main-content">
            <div class="header">
                <div class="dropdown">
                    <button class="dropdown-btn">
                        <img src="imgs/icon.png" alt="Reuse Tech" class="dropdown-icon">
                        Reuse Tech
                    </button>
                </div>
                <div class="icons">
                    <button><i class="fa-solid fa-bell"></i></button>
                    <button><i class="fa-solid fa-magnifying-glass"></i></button>
                    <button><i class="fa-solid fa-user"></i></button>
                </div>
            </div>

            <div class="config-container">
                <h2>Configurações</h2>

                <div class="config-section">
                    <h3>Perfil da Empresa</h3>
                    <div class="config-form">
                        <div class="form-group">
                            <label for="empresa">Nome da Empresa</label>
                            <input type="text" id="empresa" name="empresa" value="Reuse Tech">
                        </div>

                        <div class="form-group">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" value="reusetech@gmail.com">
                        </div>

                        <div class="form-group">
                            <label for="cnpj">CNPJ</label>
                            <input type="text" id="cnpj" name="cnpj" value="31.024.432/0001-47">
                        </div>

                        <div class="form-group">
                            <label for="telefone">Telefone</label>
                            <input type="text" id="telefone" name="telefone" value="(71) 99999-9999">
                        </div>
                    </div>
                </div>

                <div class="config-section">
                    <h3>Segurança</h3>
                    <div class="config-form">
                        <div class="form-group">
                            <label for="senha-atual">Senha Atual</label>
                            <div class="password-container">
                                <input type="password" id="senha-atual" name="senha-atual" placeholder="********">
                                <button type="button" class="toggle-password">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="nova-senha">Nova Senha</label>
                            <div class="password-container">
                                <input type="password" id="nova-senha" name="nova-senha" placeholder="********">
                                <button type="button" class="toggle-password">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="confirmar-senha">Confirmar Nova Senha</label>
                            <div class="password-container">
                                <input type="password" id="confirmar-senha" name="confirmar-senha"
                                    placeholder="********">
                                <button type="button" class="toggle-password">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="config-section">
                    <h3>Notificações</h3>
                    <div class="config-form">
                        <div class="checkbox-group">
                            <input type="checkbox" id="notif-email" name="notif-email" checked>
                            <label for="notif-email">Receber notificações por e-mail</label>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="notif-app" name="notif-app" checked>
                            <label for="notif-app">Receber notificações no aplicativo</label>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="notif-coleta" name="notif-coleta" checked>
                            <label for="notif-coleta">Alertas de pontos de coleta</label>
                        </div>

                        <div class="checkbox-group">
                            <input type="checkbox" id="notif-relatorio" name="notif-relatorio" checked>
                            <label for="notif-relatorio">Relatórios semanais</label>
                        </div>
                    </div>
                </div>

                <div class="config-buttons">
                    <button class="btn-salvar">Salvar Alterações</button>
                    <button class="btn-cancelar">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="configuracoes.js"></script>
</body>

</html>
